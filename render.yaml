# ==============================================================================
# PharmaPredict AI — Render Cloud Blueprint Specification
# Cloud Staging Deployment: Docker-based Flask Web Service + Pre-Deploy Migration
# ==============================================================================
services:
  - type: web
    name: pharmapredict-backend-staging
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon
    healthCheckPath: /health/live
    preDeployCommand: python scripts/deploy_migrations.py
    autoDeploy: false
    envVars:
      - key: FLASK_ENV
        value: staging
      - key: APP_NAME
        value: "PharmaPredict AI"
      - key: APP_VERSION
        value: "1.0.0"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: ENFORCE_MIGRATION_CHECK
        value: "true"
      - key: AUTO_MIGRATE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://pharmapredict-ai.vercel.app"
      - key: REDIS_URL
        sync: false

